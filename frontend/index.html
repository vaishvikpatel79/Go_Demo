<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go Demo</title>

  <style>
    :root {
      color-scheme: light;
      font-family: "Palatino Linotype", Palatino, serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(145deg, #f3efe6, #e4f0ea 45%, #e8eef6);
      color: #222;
    }

    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }

    h1 {
      margin: 0 0 .35rem;
      font-size: 2rem;
    }

    p {
      opacity: .8;
      line-height: 1.45;
    }

    .meta {
      font-size: .9rem;
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(255,255,255,.75);
      border-radius: 8px;
    }

    button {
      margin-top: 1rem;
      padding: .65rem 1rem;
      border: 0;
      border-radius: 6px;
      background: #2f5d4a;
      color: white;
      cursor: pointer;
      font: inherit;
    }
  </style>
</head>

<body>

<main>

<h1>Go Demo</h1>

<p>
Frontend served by NGINX.
Backend served through the Application Load Balancer.
</p>

<button id="refresh">
Load API Info
</button>

<div class="meta" id="info">
Click the button to call the backend.
</div>

</main>

<script>

const API="/api";

async function loadInfo(){

    const response = await fetch(`${API}/info`);

    const data = await response.json();

    document.getElementById("info").innerHTML = `
        <strong>Name:</strong> ${data.name}<br>
        <strong>Language:</strong> ${data.language}<br>
        <strong>Services:</strong> ${data.services.join(", ")}
    `;
}

document.getElementById("refresh").onclick = loadInfo;

loadInfo();

</script>

</body>
</html>
